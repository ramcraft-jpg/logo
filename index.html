<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ONECORE Pharma</title>
  <style>:root{--brand-red:#e31e24;--bg-white:#fff}*{box-sizing:border-box;margin:0;padding:0}body{background:var(--bg-white);justify-content:center;align-items:center;min-height:100vh;font-family:system-ui,-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif;display:flex;overflow-x:hidden}.hero-brand-section{justify-content:center;align-items:center;width:100%;max-width:1300px;padding:40px;display:flex}.brand-lockup{justify-content:center;align-items:center;gap:60px;width:100%;animation:.9s cubic-bezier(.16,1,.3,1) 1.5s forwards shiftFarLeft;display:flex;transform:translate(120px)}.logo-mark{flex-shrink:0;width:320px;height:320px;position:relative}.brand-stick{background-color:var(--brand-red);transform-origin:bottom;z-index:1;border-radius:30px;width:52px;height:170px;position:absolute;bottom:35px;left:45px;transform:rotate(38deg)}.dots-orbit{animation:1.4s cubic-bezier(.2,.8,.2,1) forwards spinDial;position:absolute;inset:0}.photo-dot{width:80px;height:80px;box-shadow:none;cursor:pointer;z-index:2;background:0 0;border:none;border-radius:50%;transition:transform .3s cubic-bezier(.34,1.56,.64,1);display:block;position:absolute;overflow:hidden}.photo-dot img{object-fit:cover;border-radius:50%;width:100%;height:100%;animation:1.4s cubic-bezier(.2,.8,.2,1) forwards counterSpin;display:block}.photo-dot:hover{z-index:10;transform:scale(1.18)}.dot-1{top:110px;left:10px}.dot-2{top:15px;left:55px}.dot-3{top:15px;right:55px}.dot-4{top:110px;right:10px}.dot-5{bottom:25px;right:65px}.brand-text{opacity:0;flex-direction:column;animation:.8s cubic-bezier(.16,1,.3,1) 2s forwards revealText;display:flex;transform:translate(-40px)}.brand-name{color:var(--brand-red);letter-spacing:.02em;font-size:5.6rem;font-weight:850;line-height:1}.brand-subtext{color:var(--brand-red);letter-spacing:.24em;text-transform:uppercase;white-space:nowrap;margin-top:14px;font-size:1.35rem;font-weight:600}@keyframes spinDial{0%{opacity:0;transform:rotate(-180deg)scale(.6)}to{opacity:1;transform:rotate(0)scale(1)}}@keyframes counterSpin{0%{transform:rotate(180deg)}to{transform:rotate(0)}}@keyframes shiftFarLeft{0%{transform:translate(120px)}to{transform:translate(-60px)}}@keyframes revealText{0%{opacity:0;transform:translate(-35px)}to{opacity:1;transform:translate(0)}}@media (width<=900px){.brand-lockup{flex-direction:column;gap:30px;animation:none;transform:none}.brand-text{text-align:center;align-items:center;animation-delay:1.4s}.brand-name{font-size:3.5rem}.brand-subtext{letter-spacing:.14em;font-size:.95rem}}</style>
</head>

<body>

  <section class="hero-brand-section">
    <div class="brand-lockup">

      <div class="logo-mark">

        <!-- Rotating 5 Circles (All locked to identical 82px size) -->
        <div class="dots-orbit">
          <div class="photo-dot dot-1" title="Field 1">
            <img src="assets/dot1.png" alt="Field 1" />
          </div>
          <div class="photo-dot dot-2" title="Field 2">
            <img src="assets/dot2.png" alt="Field 2" />
          </div>
          <div class="photo-dot dot-3" title="Field 3">
            <img src="assets/dot3.png" alt="Field 3" />
          </div>
          <div class="photo-dot dot-4" title="Field 4">
            <img src="assets/dot4.png" alt="Field 4" />
          </div>
          <div class="photo-dot dot-5" title="Field 5">
            <img src="assets/dot5.png" alt="Field 5" />
          </div>
        </div>

        <!-- Solid red stick pointing toward 3 o'clock -->
        <div class="brand-stick"></div>
      </div>

      <div class="brand-text">
        <h1 class="brand-name">ONECORE</h1>
        <p class="brand-subtext">PHARMA PRIVATE LIMITED</p>
      </div>

    </div>
  </section>

</body>

</html>
